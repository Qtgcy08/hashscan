name: ActionBuild

on:
    push:
      tags: ["V*"]  # 改为大写 V 开头的标签
    workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        arch: [x64, arm64]
        exclude:
          - os: windows-latest
            arch: arm64  # Windows ARM64需要额外配置

    steps:
    - uses: actions/checkout@v3

    - name: Extract Version
      shell: bash
      run: |
        # 提取纯版本号（去掉V前缀）
        echo "VERSION=${GITHUB_REF_NAME#V}" >> $GITHUB_ENV
        echo "FULL_VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV

    - name: Extract Version
      shell: bash
      run: |
        # 提取纯版本号（去掉V前缀）
        echo "VERSION=${GITHUB_REF_NAME#V}" >> $GITHUB_ENV
        echo "FULL_VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # 平台无关的依赖安装
    - name: Install base dependencies
      shell: bash
      run: |
        pip install nuitka -U
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # Windows专属配置
    - name: Windows Setup (MinGW)
      if: matrix.os == 'windows-latest'
      shell: cmd
      run: |
        choco install mingw -y --params="/InstallDir:C:\mingw /Architecture:x64"
        echo C:\mingw\bin >> "%GITHUB_PATH%"

    # Linux专属配置
    - name: Linux Setup (GCC)
      if: matrix.os == 'ubuntu-latest'
      shell: bash
      run: |
        sudo apt-get update
        if [ "${{ matrix.arch }}" == "arm64" ]; then
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
        else
          sudo apt-get install -y gcc g++
        fi

    # macOS专属配置
    - name: macOS Setup (Xcode)
      if: matrix.os == 'macos-latest'
      shell: bash
      run: |
        xcode-select --install || true

    # 统一构建命令（自动适应平台）
    - name: Build with Nuitka
      shell: bash
      run: |
        OUTPUT_NAME="hashscan_${GITHUB_REF_NAME#v}_${RUNNER_OS}_${{ matrix.arch }}"
        
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          python -m nuitka ^
            --standalone ^
            --lto=yes ^
            --jobs=8 ^
            --mingw64 ^
            --disable-ccache ^
            --windows-icon-from-ico=assets/icon.ico ^
            --output-filename="$OUTPUT_NAME" ^
            --output-dir=dist ^
            hashscan.py
        else
          python -m nuitka \
            --standalone \
            --lto=yes \
            --jobs=8 \
            --disable-ccache \
            --output-filename="$OUTPUT_NAME" \
            --output-dir=dist \
            hashscan.py
        fi

    - name: Upload Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: hashscan-${{ runner.os }}-${{ matrix.arch }}
        path: dist/*

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        name: ${{ env.FULL_VERSION }} Release
        tag_name: ${{ github.ref }}
        body: |
          ### 编译信息
          - **版本**: ${{ env.FULL_VERSION }}
          - **构建系统**: ${{ runner.os }} (${{ matrix.arch }})
          - **构建时间**: ${{ steps.date.outputs.date }}
          - **Nuitka版本**: $(python -m nuitka --version)
          
          ### 下载说明
          文件名格式: `hashscan_${FULL_VERSION}_<系统>_<架构>`
        files: |
          dist/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
