name: ActionBuild

on:
  push:
    tags: ["V*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        arch: [x64]
        exclude:
          - os: windows-latest
            arch: arm64

    steps:
    - uses: actions/checkout@v3

    - name: Extract Version
      shell: bash
      run: |
        TAG_VERSION=${GITHUB_REF_NAME#v}
        TAG_VERSION=${TAG_VERSION#V}
        echo "VERSION=${TAG_VERSION}" >> $GITHUB_ENV
        echo "FULL_VERSION=V${TAG_VERSION}" >> $GITHUB_ENV

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install nuitka==2.7 -U
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Windows Setup
      if: matrix.os == 'windows-latest'
      shell: cmd
      run: |
        choco install mingw -y --params="/InstallDir:C:\mingw /Architecture:x64"
        echo C:\mingw\bin >> "%GITHUB_PATH%"

    - name: Build with Nuitka
      shell: bash
      run: |
        OUTPUT_NAME="hashscan_${FULL_VERSION}_${RUNNER_OS}_${{ matrix.arch }}"
        
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          python -m nuitka --standalone --lto=yes --jobs=4 --mingw64 --disable-ccache --windows-icon-from-ico=assets/icon.ico --output-filename="$OUTPUT_NAME" --output-dir=dist hashscan.py
        else
          python -m nuitka \
            --standalone \
            --lto=yes \
            --jobs=4 \
            --disable-ccache \
            --output-filename="$OUTPUT_NAME" \
            --output-dir=dist \
            hashscan.py
        fi

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: hashscan-${{ runner.os }}-${{ matrix.arch }}
        path: dist/*


    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        name: ${{ env.FULL_VERSION }} Release
        tag_name: ${{ github.ref }}
        body: |
          ### Build Information
          - **Version**: ${{ env.FULL_VERSION }}
          - **Platform**: ${{ runner.os }} (${{ matrix.arch }})
          - **Build Time**: ${{ steps.date.outputs.date }}
          - **Nuitka Version**: $(python -m nuitka --version)
          
          ### Download Instructions
          Filename format: `hashscan_${FULL_VERSION}_<OS>_<ARCH>`
        files: |
          dist/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
